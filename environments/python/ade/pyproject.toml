[project]
name = "dbt-bench-ade-image-dependencies"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dbt-core==1.10.11", "dbt-duckdb==1.9.3", "duckdb==1.3.0",
  "gdown>=5.2.0", "pyyaml>=6.0", "uv>=0.7"
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
